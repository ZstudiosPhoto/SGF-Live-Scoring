<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SGF Event Calendar &amp; Register</title>
<meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbzN8U048Qs2T_z8srNQX3hTZVwc8AcBw2_k3EV7FVFchoAqIkG8TTAUJvwH6L1tvw8e/exec">
<style>
  /* This page redirects to the Apps Script calendar immediately.  The browser keeps
     painting THIS document until Google's page is ready to draw, so everything below
     is what the golfer looks at during the 3-6 second handoff.  Before it was a bare
     line of text that flashed past and left a white screen; now it is a spinning golf
     ball that stays put until the calendar appears. */
  html, body { margin: 0; padding: 0; height: 100%; background: #eef5e9; }
  .wrap {
    display: flex; align-items: center; justify-content: center; height: 100%;
    text-align: center; padding: 24px; box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1b5e20;
  }
  .ball {
    width: 76px; height: 76px; margin: 0 auto 22px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 26% 26%, rgba(0,0,0,.10) 1.6px, transparent 2px) 0 0/17px 17px,
      radial-gradient(circle at 70% 62%, rgba(0,0,0,.10) 1.6px, transparent 2px) 0 0/17px 17px,
      radial-gradient(circle at 32% 30%, #ffffff, #dfe6db 72%, #b9c4b3 100%);
    box-shadow: 0 6px 16px rgba(27,94,32,.22), inset -5px -6px 12px rgba(0,0,0,.10);
    animation: roll 1.15s linear infinite;
  }
  @keyframes roll { to { transform: rotate(360deg); } }
  h1 { font-size: 1.12rem; font-weight: 700; margin: 0 0 8px; letter-spacing: .2px; }
  p  { font-size: .92rem; color: #4a6b4d; margin: 0 0 6px; line-height: 1.5; }
  .dots span {
    display: inline-block; animation: blink 1.4s infinite both; font-weight: 700;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .fallback { margin-top: 26px; font-size: .82rem; }
  .fallback a { color: #1565c0; font-weight: bold; }
  @media (prefers-reduced-motion: reduce) {
    .ball { animation: none; }
    .dots span { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<div class="wrap"><div>
  <div class="ball" role="img" aria-label="Golf ball spinning while the calendar loads"></div>
  <h1>Hang tight &mdash; the SGF Calendar is loading</h1>
  <p class="dots">Grabbing the latest tee times<span>.</span><span>.</span><span>.</span></p>
  <p class="fallback"><a href="https://script.google.com/macros/s/AKfycbzN8U048Qs2T_z8srNQX3hTZVwc8AcBw2_k3EV7FVFchoAqIkG8TTAUJvwH6L1tvw8e/exec">Tap here if it does not open automatically</a></p>
</div></div>
<script>window.location.replace("https://script.google.com/macros/s/AKfycbzN8U048Qs2T_z8srNQX3hTZVwc8AcBw2_k3EV7FVFchoAqIkG8TTAUJvwH6L1tvw8e/exec");</script>
</body>
</html>
