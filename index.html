<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SGF Scoring">
<title>Saturday Golf Friends – Live Scoring</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&display=swap');
  :root{
    --sgf-green:#3aaa35;--sgf-green-dark:#2a8026;--sgf-green-darker:#1a5518;
    --sgf-green-light:#5cc957;--sgf-green-pale:#eaf7e9;--sgf-black:#111a10;
    --gold:#d4a843;--gold-light:#f0cc70;--text:#142010;--muted:#4a7044;
    --border:#b8ddb5;--card-bg:#fff;--cream:#f6fcf5;
    --eagle-bg:#1a3a7a;--eagle-fg:#fff;--birdie-bg:#2a8026;--birdie-fg:#fff;
    --par-bg:#eef5ed;--par-fg:#2a5028;--bogey-bg:#fde8e8;--bogey-fg:#c0392b;
    --double-bg:#c0392b;--double-fg:#fff;--triple-bg:#6b0f0f;--triple-fg:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:'Nunito',sans-serif;background:var(--sgf-green-darker);color:var(--text);font-size:15px;display:flex;flex-direction:column;}
  .screen{display:none;height:100vh;flex-direction:column;overflow:hidden;}
  .screen.active{display:flex;}
  /* HEADER */
  .app-header{background:linear-gradient(150deg,var(--sgf-black) 0%,var(--sgf-green-darker) 45%,var(--sgf-green-dark) 100%);padding:10px 14px;border-bottom:3px solid var(--sgf-green);display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .sgf-logo{width:52px;height:52px;flex-shrink:0;border-radius:6px;overflow:hidden;border:2px solid rgba(255,255,255,0.15);background:#fff;}
  .sgf-logo img{width:100%;height:100%;object-fit:contain;padding:2px;}
  .header-text{flex:1;min-width:0;}
  .header-brand{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:#fff;letter-spacing:2px;line-height:1;}
  .header-sub{font-size:0.68rem;color:var(--sgf-green-light);font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-top:1px;}
  .header-actions{display:flex;gap:5px;flex-shrink:0;}
  .hdr-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:6px 11px;border-radius:20px;font-size:0.72rem;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;transition:all 0.2s;white-space:nowrap;}
  .hdr-btn:hover,.hdr-btn.active{background:var(--sgf-green);border-color:var(--sgf-green);}
  /* LIVE BADGE */
  .live-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(58,170,53,0.2);border:1px solid var(--sgf-green);border-radius:12px;padding:2px 8px;font-size:0.65rem;font-weight:800;color:var(--sgf-green-light);text-transform:uppercase;letter-spacing:1px;}
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--sgf-green-light);animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
  /* SETUP */
  .setup-body{flex:1;padding:14px 13px 24px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .setup-card{background:var(--card-bg);border-radius:14px;padding:16px 15px;box-shadow:0 8px 32px rgba(0,0,0,0.22);border:1px solid rgba(58,170,53,0.2);margin-bottom:12px;}
  .section-title{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--sgf-green-dark);letter-spacing:1.5px;margin-bottom:12px;border-bottom:2px solid var(--sgf-green-pale);padding-bottom:7px;display:flex;align-items:center;gap:7px;}
  .section-title::before{content:'';display:inline-block;width:4px;height:16px;background:var(--sgf-green);border-radius:2px;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:0.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
  .field input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'Nunito',sans-serif;font-size:0.93rem;color:var(--text);background:var(--cream);outline:none;transition:border 0.2s;}
  .field input:focus{border-color:var(--sgf-green);}
  .field-hint{font-size:0.68rem;color:var(--muted);margin-top:3px;}
  .green-btn{width:100%;padding:11px;background:var(--sgf-green);color:white;border:none;border-radius:8px;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.88rem;cursor:pointer;transition:background 0.2s;margin-top:4px;}
  .green-btn:hover{background:var(--sgf-green-dark);}
  .green-btn:disabled{background:#aaa;cursor:not-allowed;}
  .player-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .player-item{display:flex;align-items:center;gap:7px;background:var(--sgf-green-pale);border-radius:8px;padding:7px 9px;border:1px solid rgba(58,170,53,0.15);}
  .player-num{font-weight:900;color:var(--sgf-green-dark);font-size:0.78rem;width:20px;flex-shrink:0;}
  .player-item input{flex:1;border:none;background:transparent;font-family:'Nunito',sans-serif;font-size:0.9rem;color:var(--text);outline:none;font-weight:700;}
  .rm-btn{background:none;border:none;color:#bbb;cursor:pointer;font-size:1.1rem;padding:0 2px;line-height:1;}
  .rm-btn:hover{color:#c0392b;}
  .add-player-row{width:100%;padding:9px;border:2px dashed var(--sgf-green);background:transparent;color:var(--sgf-green-dark);border-radius:8px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.85rem;transition:background 0.2s;}
  .add-player-row:hover{background:var(--sgf-green-pale);}
  .par-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:6px;}
  .par-hole-label{text-align:center;font-size:0.63rem;color:var(--muted);font-weight:800;}
  .par-input{width:100%;text-align:center;border:1.5px solid var(--border);border-radius:5px;padding:5px 1px;font-size:0.82rem;font-family:'Nunito',sans-serif;font-weight:800;color:var(--text);background:var(--cream);outline:none;-moz-appearance:textfield;}
  .par-input::-webkit-outer-spin-button,.par-input::-webkit-inner-spin-button{-webkit-appearance:none;}
  .par-input:focus{border-color:var(--sgf-green);}
  .start-btn{width:100%;padding:15px;background:linear-gradient(135deg,var(--sgf-green),var(--sgf-green-dark));color:white;border:none;border-radius:12px;font-size:1.05rem;font-weight:900;cursor:pointer;font-family:'Nunito',sans-serif;letter-spacing:0.5px;box-shadow:0 5px 20px rgba(42,128,38,0.5);transition:transform 0.1s;}
  .start-btn:active{transform:scale(0.98);}
  .end-round-btn{width:100%;padding:12px;background:transparent;color:#c0392b;border:2px solid #c0392b;border-radius:12px;font-size:0.9rem;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;transition:all 0.2s;}
  .end-round-btn:hover{background:#fde8e8;}
  .status-msg{font-size:0.78rem;padding:7px 11px;border-radius:7px;margin-top:7px;text-align:center;font-weight:700;}
  .status-ok{background:#e6f7e5;color:#1e6b1e;}
  .status-err{background:#fde8e8;color:#c0392b;}
  .status-info{background:#e8f0fe;color:#1a3a8a;}
  /* JOIN SCREEN */
  .join-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;}
  .join-card{background:var(--card-bg);border-radius:16px;padding:24px 20px;width:100%;max-width:380px;box-shadow:0 12px 40px rgba(0,0,0,0.3);border:1px solid rgba(58,170,53,0.25);}
  .join-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--sgf-green-dark);letter-spacing:1px;margin-bottom:4px;}
  .join-sub{font-size:0.82rem;color:var(--muted);margin-bottom:20px;font-weight:600;}
  .round-info-box{background:var(--sgf-green-pale);border-radius:10px;padding:12px 14px;margin-bottom:16px;border:1px solid rgba(58,170,53,0.2);}
  .round-info-course{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--sgf-green-dark);letter-spacing:1px;}
  .round-info-date{font-size:0.78rem;color:var(--muted);font-weight:700;}
  .round-info-players{font-size:0.78rem;color:var(--sgf-green-dark);font-weight:800;margin-top:4px;}
  /* SCORING */
  .scoring-meta-bar{background:var(--cream);border-bottom:1px solid var(--border);padding:8px 13px;flex-shrink:0;}
  .meta-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .meta-course{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--sgf-green-dark);letter-spacing:1px;}
  .nine-tabs{display:flex;background:#d0eacf;border-radius:9px;padding:3px;}
  .nine-tab{flex:1;padding:7px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-size:0.78rem;font-family:'Nunito',sans-serif;color:var(--muted);font-weight:800;transition:all 0.2s;}
  .nine-tab.active{background:white;color:var(--sgf-green-dark);box-shadow:0 1px 5px rgba(0,0,0,0.12);}
  .legend-bar{display:flex;flex-wrap:wrap;gap:5px;padding:6px 11px;background:var(--cream);border-bottom:1px solid var(--border);flex-shrink:0;}
  .legend-item{display:flex;align-items:center;gap:3px;font-size:0.63rem;color:var(--muted);font-weight:700;}
  .legend-dot{width:10px;height:10px;border-radius:2px;}
  .score-table-wrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;}
  .score-table{width:100%;border-collapse:collapse;min-width:340px;}
  .th-header{background:var(--sgf-green);position:sticky;top:0;z-index:10;}
  .th-header th{color:rgba(255,255,255,0.9);font-size:0.63rem;font-weight:800;padding:6px 2px;text-align:center;white-space:nowrap;}
  .th-header .th-name{text-align:left;padding-left:9px;color:#fff;font-size:0.66rem;}
  .th-par{background:var(--sgf-green-dark);position:sticky;top:29px;z-index:9;}
  .th-par th{color:rgba(255,255,255,0.7);font-size:0.63rem;font-weight:800;padding:4px 2px;text-align:center;}
  .th-par .th-name{text-align:left;padding-left:9px;color:rgba(255,255,255,0.4);font-size:0.62rem;}
  .score-row{border-bottom:1px solid #c8e6c4;background:#ffffff;}
  .score-row:nth-child(even){background:#e8f7e6;}
  .score-row.my-row{background:#fffbef!important;border-left:3px solid var(--gold);}
  .td-name{padding:4px 4px 4px 8px;white-space:nowrap;min-width:90px;}
  .td-name-text{font-size:0.78rem;font-weight:800;color:var(--text);}
  .td-score{padding:3px 1px;text-align:center;}
  .score-inp{width:29px;height:28px;text-align:center;border:1.5px solid #cce0ca;border-radius:5px;font-size:0.8rem;font-family:'Nunito',sans-serif;font-weight:900;outline:none;-moz-appearance:textfield;background:white;color:var(--text);transition:all 0.15s;}
  .score-inp::-webkit-outer-spin-button,.score-inp::-webkit-inner-spin-button{-webkit-appearance:none;}
  .score-inp:focus{border-color:var(--sgf-green);}
  .score-inp:disabled{background:#f0f0f0;color:#aaa;border-color:#ddd;cursor:not-allowed;}
  .score-inp.eagle{background:var(--eagle-bg);color:var(--eagle-fg);border-color:var(--eagle-bg);}
  .score-inp.birdie{background:var(--birdie-bg);color:var(--birdie-fg);border-color:var(--birdie-bg);}
  .score-inp.par-s{background:var(--par-bg);color:var(--par-fg);}
  .score-inp.bogey{background:var(--bogey-bg);color:var(--bogey-fg);border-color:#f5b7b7;}
  .score-inp.double{background:var(--double-bg);color:var(--double-fg);border-color:var(--double-bg);}
  .score-inp.triple{background:var(--triple-bg);color:var(--triple-fg);border-color:var(--triple-bg);}
  .td-sub{text-align:center;font-weight:800;font-size:0.78rem;color:var(--muted);padding:0 4px;white-space:nowrap;}
  .td-total{text-align:center;font-weight:900;font-size:0.82rem;padding:0 4px;white-space:nowrap;}
  .td-total.under{color:#1e6b1e;}.td-total.even{color:#2a5028;}.td-total.over{color:#c0392b;}
  /* SYNC BAR */
  .sync-bar{background:var(--sgf-black);padding:9px 11px;border-top:3px solid var(--sgf-green);display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;flex-shrink:0;}
  .sync-btn{padding:9px 13px;border:none;border-radius:8px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:0.77rem;font-weight:800;transition:all 0.2s;}
  .btn-sheets{background:var(--sgf-green);color:#fff;}.btn-sheets:hover{background:var(--sgf-green-dark);}
  .btn-lb{background:var(--gold);color:var(--sgf-black);}.btn-lb:hover{background:var(--gold-light);}
  .btn-link{background:transparent;border:1px solid #3a5a38;color:#8acc87;}
  .btn-link:hover{border-color:#8acc87;color:#fff;}
  .sync-result{color:#7dcea0;font-size:0.72rem;width:100%;text-align:center;font-weight:700;}
  /* LEADERBOARD */
  .lb-body{flex:1;padding:14px 13px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .lb-card{background:var(--card-bg);border-radius:13px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,0.2);border:1px solid rgba(58,170,53,0.25);}
  .lb-row{display:flex;align-items:center;padding:11px 13px;border-bottom:1px solid var(--border);gap:9px;}
  .lb-row:last-child{border-bottom:none;}
  .lb-row.top1{background:linear-gradient(90deg,#f0fced 0%,white 100%);}
  .lb-pos{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--muted);width:28px;text-align:center;flex-shrink:0;}
  .lb-info{flex:1;}
  .lb-name{font-weight:800;font-size:0.9rem;}
  .lb-holes{font-size:0.67rem;color:var(--muted);}
  .lb-gross{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--text);}
  .lb-vp{font-size:0.77rem;font-weight:800;padding:2px 7px;border-radius:5px;}
  .lb-vp.under{background:#e6f7e5;color:#1e6b1e;}.lb-vp.even{background:#eef5ed;color:#2a5028;}.lb-vp.over{background:#fde8e8;color:#c0392b;}
  .lb-inc{color:#bbb;font-size:0.73rem;font-style:italic;}
  .back-btn{display:block;width:calc(100% - 26px);margin:13px auto 0;padding:13px;background:var(--sgf-green);color:white;border:none;border-radius:10px;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.93rem;cursor:pointer;}
  /* LOADING */
  .loading-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
  .spinner{width:40px;height:40px;border:4px solid rgba(58,170,53,0.2);border-top-color:var(--sgf-green);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-text{color:#8acc87;font-weight:700;font-size:0.9rem;}
  @media(max-width:370px){.score-inp{width:26px;height:25px;font-size:0.72rem;}.header-brand{font-size:1.25rem;}}
</style>
</head>

<div id="screen-setup" class="screen active">
  <div class="app-header">
    <div class="sgf-logo"><img id="logo1" alt="SGF"></div>
    <div class="header-text">
      <div class="header-brand">Saturday Golf Friends</div>
      <div class="header-sub">Admin Setup</div>
    </div>
  </div>
  <div class="setup-body">
    <div class="setup-card">
      <div class="section-title">Round Details</div>
      <div class="field"><label>Course Name</label><input type="text" id="inp-course" placeholder="e.g. Torrey Pines South" maxlength="50"></div>
      <div class="field"><label>Date of Play</label><input type="date" id="inp-date"></div>
    </div>
    <div class="setup-card">
      <div class="section-title">Google Sheets</div>
      <div class="field">
        <label>Google API Key</label>
        <input type="password" id="inp-apikey" placeholder="Paste your Google API Key" autocomplete="off">
        <div class="field-hint">Used to load player names from your sheet</div>
      </div>
      <div class="field">
        <label>Sheet ID</label>
        <input type="text" id="inp-sheetid" placeholder="Paste your Google Sheet ID" maxlength="120">
      </div>
      <div class="field">
        <label>Sheet Tab Name</label>
        <input type="text" id="inp-tabname" value="gross.scores">
      </div>
      <button class="green-btn" id="btn-load" onclick="loadPlayersFromSheet()">Load Players from Sheet</button>
      <div id="load-status" style="display:none;" class="status-msg"></div>
    </div>
